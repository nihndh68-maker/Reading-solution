<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Reading Tree</title>
<style>
:root{--bg:#fdf6f9;--ink:#4a4458;--mute:#8e869c;--line:#cdbfe3;--acc:#9b87d6;--node:#ffffff;--glow:#cdbfe355;--hl:#fff1a8;--p1:#ffd6e0;--p2:#d6ecff;--p3:#d9f5e3;--p4:#fff0c9;--p5:#e8dcff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;
 background-image:radial-gradient(var(--glow),transparent 60%);background-repeat:no-repeat}
.wrap{max-width:900px;margin:0 auto;padding:32px 16px 80px}
.bar{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.bar input{width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--node);color:var(--ink);font:inherit;outline:none}
.bar input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{all:unset;cursor:pointer;font-size:.8rem;color:var(--mute);padding:2px 10px;border:1px solid var(--line);border-radius:999px}
.tools button:hover{color:var(--acc);border-color:var(--acc)}
/* tree */
ul.tree,ul.tree ul{list-style:none;margin:0;padding:0}
ul.tree ul{margin-left:26px}
.tree li{position:relative;padding-left:28px}
.tree li::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:2px solid var(--line)}
.tree li:last-child::before{bottom:auto;height:22px}
.tree li::after{content:"";position:absolute;left:0;top:0;width:24px;height:22px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-bottom-left-radius:16px}
.tree li:last-child::after{border-left:2px solid var(--line)}
.tree li:not(:last-child)::after{border-left:0}
.tree li{--d:0s}
.root{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.root .dot{width:44px;height:44px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 8px var(--glow);flex:none}
.root h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}.root small{display:block;color:var(--mute);font-size:.85rem;font-weight:400}
.node{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin:7px 0;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--node);font-weight:600;transition:.2s;max-width:100%}
.node:hover,.node:focus-visible{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
.node .caret{width:8px;height:8px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg);transition:.25s}
.node[aria-expanded=true] .caret{transform:rotate(45deg)}
.node small{color:var(--mute);font-weight:400}
.node.pend{border-style:dashed;opacity:.65}.node.ok{opacity:1;border-style:solid}
.branch{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.branch>div{overflow:hidden;min-height:0}
.branch.open{grid-template-rows:1fr}
a.leaf{display:inline-flex;align-items:center;gap:8px;margin:7px 0;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--node);color:inherit;text-decoration:none;font-weight:600;transition:.2s}
a.leaf:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
a.leaf small{opacity:.7;font-weight:400}
.passages{list-style:none;margin:0 0 6px;padding:0}
.passages li{padding:0 0 0 18px!important;color:var(--mute);font-size:.86rem;position:relative}
.passages li::before{display:none!important}.passages li::after{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--line);border:0!important}
.test>.branch .passages{margin-left:6px}
mark{background:var(--hl);color:inherit;border-radius:3px}
.empty{color:var(--mute);margin-top:24px}

body{background:radial-gradient(circle at 10% 0,#ffd6e088,transparent 40%),radial-gradient(circle at 95% 25%,#d6ecff99,transparent 40%),radial-gradient(circle at 30% 100%,#d9f5e399,transparent 45%),var(--bg);background-attachment:fixed}
.root .dot{background:linear-gradient(135deg,var(--p1),var(--p5) 55%,var(--p2));box-shadow:0 0 0 8px #e8dcff88}
.tree>li>.node{background:var(--p1);border-color:transparent}
.tree>li:nth-child(5n+2)>.node{background:var(--p2)}
.tree>li:nth-child(5n+3)>.node{background:var(--p3)}
.tree>li:nth-child(5n+4)>.node{background:var(--p4)}
.tree>li:nth-child(5n+5)>.node{background:var(--p5)}
.tree>li>.node.pend{background:transparent;border-color:var(--line)}
.test>.node{background:#fff}
.node:hover,.node:focus-visible{border-color:var(--acc)}
a.leaf{background:var(--p5);border-color:transparent;border-radius:999px}
a.leaf:hover{background:var(--acc);color:#fff}
.passages li::after{background:var(--acc);opacity:.6}
.bar{background:linear-gradient(#fdf6f9ee 75%,transparent)}
mark{color:var(--ink)}
</style></head><body><div class="wrap">
<div class="bar"><input id="q" type="search" placeholder="Search a book, test or topic…" autocomplete="off" aria-label="Search">
<div class="tools"><button id="ex">Expand all</button><button id="co">Collapse all</button><span id="count" style="margin-left:auto;font-size:.8rem;color:var(--mute)"></span></div></div>
<div class="root"><span class="dot"></span><h1>IELTS Reading<small>Cambridge 6 – 21 · passages &amp; answers</small></h1></div>
<ul class="tree" id="tree"></ul><p class="empty" id="empty" hidden>No branches match.</p></div>
<script>
const BOOKS=[{"n": 6, "tests": [{"t": 1, "f": "RE_C6T1.html", "p": ["AUSTRALIA'S SPORTING SUCCESS", "DELIVERING THE GOODS", "Climate Change and the Inuit"], "x": false}, {"t": 2, "f": "RE_C6T2.html", "p": ["Advantages of public transport", "GREYING POPULATION STAYS IN THE PINK", "Numeration"], "x": false}, {"t": 3, "f": "RE_C6T3.html", "p": ["Early cinema (untitled in file)", "Motivating Employees under Adverse Conditions", "The Search for the Anti-aging Pill"], "x": false}, {"t": 4, "f": "RE_C6T4.html", "p": ["Doctoring sales", "Literate women make better mothers?", "Persistent bullying is one of the worst experiences a child can face. How can it be prevented?"], "x": false}]}, {"n": 7, "tests": [{"t": 1, "f": "RE_C7T1.html", "p": ["Let's Go Bats", "MAKING EVERY DROP COUNT", "EDUCATING PSYCHE"], "x": false}, {"t": 2, "f": "RE_C7T2.html", "p": ["Why pagodas don't fall down", "The True Cost of Food", "Makete Integrated Rural Transport Project"], "x": false}, {"t": 3, "f": "RE_C7T3.html", "p": ["Ant Intelligence", "Population movements and genetics", "Saving Europe's forests"], "x": false}, {"t": 4, "f": "RE_C7T4.html", "p": ["Pulling strings to build pyramids", "Endless Harvest", "Effects of Noise"], "x": false}]}, {"n": 8, "tests": [{"t": 1, "f": "RE_C8T1.html", "p": ["A Chronicle of Timekeeping", "Air Traffic Control in the USA", "Telepathy"], "x": false}, {"t": 2, "f": "RE_C8T2.html", "p": ["Sheet Glass Manufacture: the Float Process", "The Little Ice Age", "The meaning and power of smell"], "x": false}, {"t": 3, "f": "RE_C8T3.html", "p": ["Striking Back at Lightning with Lasers", "The Nature of Genius", "How Does the Biological Clock Tick?"], "x": false}, {"t": 4, "f": "RE_C8T4.html", "p": ["Land of the Rising Sun", "Biological Control of Pests", "Collecting Ant Specimens"], "x": false}]}, {"n": 9, "tests": [{"t": 1, "f": "RE_C9T1.html", "p": ["William Henry Perkin", "Is There Anybody Out There?", "The History of the Tortoise"], "x": false}, {"t": 2, "f": "RE_C9T E_C13T1.html", "p": ["Case Study: Tourism New Zealand website", "Why being bored is stimulating – and useful, too", "Artificial artist?"], "x": false}, {"t": 2, "f": "RE_C13T2.html", "p": ["Bringing cinnamon to Europe", "Oxytocin", "MAKING THE MOST OF TRENDS"], "x": false}, {"t": 3, "f": "RE_C13T3.html", "p": ["The coconut palm", "How baby talk gives infant brains a boost", "Whatever happened to the Harappan Civilisation?"], "x": false}, {"t": 4, "f": "RE_C13T4.html", "p": ["Cutty Sark: the fastest sailing ship of all time", "SAVING THE SOIL", "Book Review"], "x": false}]}, {"n": 14, "tests": [{"t": 1, "f": "RE_C14T1.html", "p": [], "x": false, "pending": true}, {"t": 2, "f": "RE_C14T2.html", "p": [], "x": false, "pending": true}, {"t": 3, "f": "RE_C14T3.html", "p": [], "x": false, "pending": true}, {"t": 4, "f": "RE_C14T4.html", "p": [], "x": false, "pending": true}]}, {"n": 15, "tests": [{"t": 1, "f": "RE_C15T1.html", "p": ["Nutmeg – a valuable spice", "Driverless cars", "What is exploration?"], "x": false}, {"t": 2, "f": "RE_C15T2.html", "p": ["Could urban engineers learn from dance?", "Should we try to bring extinct species back to life?", "Having a laugh"], "x": false}, {"t": 3, "f": "RE_C15T3.html", "p": ["Henry Moore (1898-1986)", "The Desolenator: producing clean water", "Why fairy tales are really scary tales"], "x": false}, {"t": 4, "f": "RE_C15T4.html", "p": ["The return of the huarango", "Silbo Gomero – the whistle 'language' of the Canary Islands", "Environmental practices of big businesses"], "x": false}]}, {"n": 16, "tests": [{"t": 1, "f": "RE_C16T1.html", "p": ["Why we need to protect polar bears", "The Step Pyramid of Djoser", "The future of work"], "x": false}, {"t": 2, "f": "RE_C16T2.html", "p": ["The White Horse of Uffington", "I contain multitudes", "How to make wise decisions"], "x": false}, {"t": 3, "f": "RE_C16T3.html", "p": ["Roman shipbuilding and navigation", "Climate change reveals ancient artefacts in Norway’s glaciers", "Plant ‘thermometer’ triggers springtime growth by measuring night-time heat"], "x": false}, {"t": 4, "f": "RE_C16T4.html", "p": ["Roman tunnels", "Changes in reading habits", "Attitudes towards Artificial Intelligence"], "x": false}]}, {"n": 17, "tests": [{"t": 1, "f": "RE_C17T1.html", "p": ["The development of the London underground railway", "Stadiums: past, present and future", "To catch a king"], "x": false}, {"t": 2, "f": "RE_C17T2.html", "p": ["The Dead Sea Scrolls", "A second attempt at domesticating the tomato", "Insight or evolution?"], "x": false}, {"t": 3, "f": "RE_C17T3.html", "p": ["The thylacine", "Palm oil", "Building the Skyline: The Birth and Growth of Manhattan’s Skyscrapers"], "x": false}, {"t": 4, "f": "RE_C17T4.html", "p": ["Bats to the rescue", "Does education fuel economic growth?", "Timur Gareyev – blindfold chess champion"], "x": false}]}, {"n": 18, "tests": [{"t": 1, "f": "RE_C18T1.html", "p": ["Urban farming", "Forest management in Pennsylvania, USA", "Conquering Earth's space junk problem"], "x": false}, {"t": 2, "f": "RE_C18T2.html", "p": ["Stonehenge", "Living with artificial intelligence", "An ideal city"], "x": false}, {"t": 3, "f": "RE_C18T3.html", "p": ["Materials to take us beyond concrete", "The steam car", "The case for mixed-ability classes"], "x": false}, {"t": 4, "f": "RE_C18T4.html", "p": ["Green roofs", "The growth mindset", "Alfred Wegener: science, exploration and the theory of continental drift"], "x": false}]}, {"n": 19, "tests": [{"t": 1, "f": "RE_C19T1.html", "p": ["How tennis rackets have changed", "The pirates of the ancient Mediterranean", "The persistence and peril of misinformation"], "x": false}, {"t": 2, "f": "RE_C19T2.html", "p": ["The Industrial Revolution in Britain", "Athletes and stress", "An inquiry into the existence of the gifted child"], "x": false}, {"t": 3, "f": "RE_C19T3.html", "p": ["Archaeologists discover evidence of prehistoric island settlers", "The global importance of wetlands", "Is the era of artificial speech translation upon us?"], "x": false}, {"t": 4, "f": "RE_C19T4.html", "p": ["The impact of climate change on butterflies in Britain", "Deep-sea mining", "The Unselfish Gene"], "x": false}]}, {"n": 20, "tests": [{"t": 1, "f": "RE_C20T1.html", "p": [], "x": false, "pending": true}, {"t": 2, "f": "RE_C20T2.html", "p": [], "x": false, "pending": true}, {"t": 3, "f": "RE_C20T3.html", "p": [], "x": false, "pending": true}, {"t": 4, "f": "RE_C20T4.html", "p": [], "x": false, "pending": true}]}, {"n": 21, "tests": [{"t": 1, "f": "RE_C21T1.html", "p": ["The Davies Sisters", "Why we need silence", "Book review: The World of Sugar"], "x": false}, {"t": 2, "f": "RE_C21T2.html", "p": ["Do animals dream?", "Mapungubwe", "Artificial Intelligence"], "x": false}, {"t": 3, "f": "RE_C21T3.html", "p": ["Saving the saiga", "The problems of getting around the city of Dar es Salaam", "Rethinking the Past"], "x": false}, {"t": 4, "f": "RE_C21T4.html", "p": ["The problems and benefits created by the spread of the water hyacinth in Kenya", "How could multilingualism benefit India’s poorest schoolchildren?", "The Globemakers: The Curious Story of an Ancient Craft"], "x": false}]}];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function hi(s,t){if(!t)return esc(s);const i=s.toLowerCase().indexOf(t);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length))}
function match(b,x,t){if(!t)return true;const hay=(`cambridge ielts ${b.n} c${b.n} book ${b.n} test ${x.t} t${x.t} c${b.n}t${x.t} ${x.f} `+x.p.join(' ')).toLowerCase();return t.split(/\s+/).every(w=>hay.includes(w))}
function stats(){const real=BOOKS.flatMap(b=>b.tests).filter(t=>!t.pending||t.ok).length;return `${BOOKS.filter(b=>b.tests.some(t=>!t.pending||t.ok)).length} books · ${real} tests`}
function tag(x){return x.x?'alternate copy':(x.pending&&!x.ok?'not added yet':'')}
/* Missing books (10, 14, 20): add RE_C10T1.html … beside this file; on a hosted site they switch on automatically. */
function detect(done){if(!location.protocol.startsWith('http'))return;
  BOOKS.flatMap(b=>b.tests).filter(t=>t.pending).forEach(t=>{
    fetch(encodeURI(t.f)).then(r=>r.ok?r.text():Promise.reject()).then(txt=>{
      if(!/passage-title/.test(txt))return;
      const d=new DOMParser().parseFromString(txt,'text/html');
      t.p=[...d.querySelectorAll('.passage-title')].map(e=>e.textContent.trim()).filter(Boolean).slice(0,3);
      t.ok=true;done();}).catch(()=>{});});}


const openB=new Set(),openT=new Set();
function render(){
 const t=$('q').value.trim().toLowerCase();let n=0,h='';
 BOOKS.forEach(b=>{const cs=b.tests.filter(x=>match(b,x,t));if(!cs.length)return;n+=cs.length;
  const bo=t||openB.has(b.n),allPend=b.tests.every(x=>x.pending&&!x.ok);
  h+=`<li><button class="node${allPend?' pend':''}" data-b="${b.n}" aria-expanded="${bo}"><span class="caret"></span>Cambridge ${b.n} <small>${allPend?'not added yet':cs.length+' tests'}</small></button>
  <div class="branch${bo?' open':''}"><div><ul>`+cs.map(x=>{const k=b.n+'-'+x.t+x.f,to=t||openT.has(k);
   return `<li class="test"><button class="node${x.pending&&!x.ok?' pend':''}" data-t="${k}" aria-expanded="${to}"><span class="caret"></span>Test ${x.t}${tag(x)?` <small>${tag(x)}</small>`:''}</button>
   <div class="branch${to?' open':''}"><div><ul><li><ul class="passages">${x.p.map(p=>`<li>${hi(p,t)}</li>`).join('')}</ul><a class="leaf" href="${encodeURI(x.f)}">Open ${esc(x.f)} <small>→</small></a></li></ul></div></div></li>`}).join('')+`</ul></div></div></li>`});
 $('tree').innerHTML=h;$('empty').hidden=!!n;$('count').textContent=stats();
}
$('tree').addEventListener('click',e=>{const b=e.target.closest('.node');if(!b)return;
 const set=b.dataset.b?openB:openT,k=b.dataset.b?+b.dataset.b:b.dataset.t;
 if($('q').value.trim())return;
 const br=b.nextElementSibling,o=!br.classList.contains('open');br.classList.toggle('open',o);b.setAttribute('aria-expanded',o);o?set.add(k):set.delete(k)});
$('ex').onclick=()=>{$('q').value='';BOOKS.forEach(b=>{openB.add(b.n);b.tests.forEach(x=>openT.add(b.n+'-'+x.t+x.f))});render()};
$('co').onclick=()=>{$('q').value='';openB.clear();openT.clear();render()};
$('q').addEventListener('input',render);render();detect(render);
</script></body></html>
