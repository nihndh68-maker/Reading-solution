<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Reading Solutions</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mute:#6b7280;--line:#e4e0d6;--accent:#1f4e8c;--accent-ink:#fff;--chip:#eef2f8;--hl:#fff3b8}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--ink:#e8eaf0;--mute:#9aa3b2;--line:#2b303c;--accent:#7aa7e6;--accent-ink:#10141b;--chip:#252b38;--hl:#5a4b12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Iowan Old Style","Palatino Linotype",serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 64px}
header{padding:40px 0 20px}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0;font-family:system-ui,sans-serif;font-size:.95rem}
.bar{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--line);font-family:system-ui,sans-serif}
.bar input{width:100%;padding:11px 14px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jump a{padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:.85rem}
.jump a:hover{background:var(--accent);color:var(--accent-ink)}
section{margin-top:32px;scroll-margin-top:110px}
h2{font-size:1.4rem;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
h2 small{font:.8rem system-ui,sans-serif;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.card b{font-size:1.05rem;display:block;margin-bottom:6px}
.card b span{font:.75rem system-ui,sans-serif;color:var(--mute);font-weight:400;margin-left:6px}
.card ol{margin:0;padding-left:1.2em;color:var(--mute);font-size:.9rem}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{display:none;color:var(--mute);margin-top:32px;font-family:system-ui,sans-serif}
footer{margin-top:48px;color:var(--mute);font:.85rem system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>IELTS Reading Solutions</h1>
<p class="sub" id="count"></p>
</header>
<div class="bar">
<input id="q" type="search" placeholder="Search by book, test or passage topic, e.g. “smell”, “C15”, “tortoise”" autocomplete="off" aria-label="Search">
<nav class="jump" id="jump" aria-label="Jump to book"></nav>
</div>
<main id="main"></main>
<p class="empty" id="empty">No tests match your search.</p>
<footer>Each test opens passages with highlighted evidence on the left and answers with explanations on the right.</footer>
</div>
<script>
const BOOKS=[{"n": 6, "tests": [{"t": 1, "f": "C6/RE_C6T1.html", "p": ["AUSTRALIA'S SPORTING SUCCESS", "DELIVERING THE GOODS", "Climate Change and the Inuit"], "x": false}, {"t": 2, "f": "C6/RE_C6T2.html", "p": ["Advantages of public transport", "GREYING POPULATION STAYS IN THE PINK", "Numeration"], "x": false}, {"t": 3, "f": "C6/RE_C6T3.html", "p": ["Early cinema (untitled in file)", "Motivating Employees under Adverse Conditions", "The Search for the Anti-aging Pill"], "x": false}, {"t": 4, "f": "C6/RE_C6T4.html", "p": ["Doctoring sales", "Literate women make better mothers?", "Persistent bullying is one of the worst experiences a child can face. How can it be prevented?"], "x": false}, {"t": 2, "f": "C6/Cambridge_IELTS_6_Test_2.html", "p": ["Advantages of public transport", "GREYING POPULATION STAYS IN THE PINK", "Numeration"], "x": true}]}, {"n": 7, "tests": [{"t": 1, "f": "C7/RE_C7T1.html", "p": ["Let's Go Bats", "MAKING EVERY DROP COUNT", "EDUCATING PSYCHE"], "x": false}, {"t": 2, "f": "C7/RE_C7T2.html", "p": ["Why pagodas don't fall down", "The True Cost of Food", "Makete Integrated Rural Transport Project"], "x": false}, {"t": 3, "f": "C7/RE_C7T3.html", "p": ["Ant Intelligence", "Population movements and genetics", "Saving Europe's forests"], "x": false}, {"t": 4, "f": "C7/RE_C7T4.html", "p": ["Pulling strings to build pyramids", "Endless Harvest", "Effects of Noise"], "x": false}]}, {"n": 8, "tests": [{"t": 1, "f": "C8/RE_C8T1.html", "p": ["A Chronicle of Timekeeping", "Air Traffic Control in the USA", "Telepathy"], "x": false}, {"t": 2, "f": "C8/RE_C8T2.html", "p": ["Sheet Glass Manufacture: the Float Process", "The Little Ice Age", "The meaning and power of smell"], "x": false}, {"t": 3, "f": "C8/RE_C8T3.html", "p": ["Striking Back at Lightning with Lasers", "The Nature of Genius", "How Does the Biological Clock Tick?"], "x": false}, {"t": 4, "f": "C8/RE_C8T4.html", "p": ["Land of the Rising Sun", "Biological Control of Pests", "Collecting Ant Specimens"], "x": false}]}, {"n": 9, "tests": [{"t": 1, "f": "C9/RE_C9T1.html", "p": ["William Henry Perkin", "Is There Anybody Out There?", "The History of the Tortoise"], "x": false}, {"t": 2, "f": "C9/RE_C9T2.html", "p": ["Classroom Noise and Auditory Problems", "Venus in Transit", "A Neuroscientist Reveals How To Think Differently"], "x": false}, {"t": 3, "f": "C9/RE_C9T3.html", "p": ["Attitudes to Language", "Tidal Power", "Information Theory – The Big Idea"], "x": false}, {"t": 4, "f": "C9/RE_C9T4.html", "p": ["The Life and Work of Marie Curie", "Young Children's Sense of Identity", "The Development of Museums"], "x": false}]}, {"n": 11, "tests": [{"t": 1, "f": "C11/RE_C11T1.html", "p": ["Crop-growing skyscrapers", "The Falkirk Wheel", "Reducing the effects of climate change"], "x": false}, {"t": 2, "f": "C11/RE_C11T2.html", "p": ["Raising the Mary Rose", "What destroyed the civilization of Easter Island?", "Neuroaesthetics"], "x": false}, {"t": 3, "f": "C11/RE_C11T3.html", "p": ["The Story of Silk", "Great Migrations", "Preface to ‘How the other half thinks: Adventures in mathematical reasoning’"], "x": false}, {"t": 4, "f": "C11/RE_C11T4.html", "p": ["Research using twins", "An introduction to film sound", "This Marvelous Invention"], "x": false}]}, {"n": 12, "tests": [{"t": 5, "f": "C12/RE_C12T5.html", "p": ["Cork", "Collecting as a hobby", "What's the purpose of gaining knowledge?"], "x": false}, {"t": 6, "f": "C12/RE_C12T6.html", "p": ["The risks agriculture faces in developing countries", "The Lost City", "The Benefits of Being Bilingual"], "x": false}, {"t": 7, "f": "C12/RE_C12T7.html", "p": ["Flying tortoises", "The Intersection of Health Sciences and Geography", "Music and the emotions"], "x": false}, {"t": 8, "f": "C12/RE_C12T8.html", "p": ["The History of Glass", "Bring back the big cats", "UK companies need more effective boards of directors"], "x": false}]}, {"n": 13, "tests": [{"t": 1, "f": "C13/RE_C13T1.html", "p": ["Case Study: Tourism New Zealand website", "Why being bored is stimulating – and useful, too", "Artificial artist?"], "x": false}, {"t": 2, "f": "C13/RE_C13T2.html", "p": ["Bringing cinnamon to Europe", "Oxytocin", "MAKING THE MOST OF TRENDS"], "x": false}, {"t": 3, "f": "C13/RE_C13T3.html", "p": ["The coconut palm", "How baby talk gives infant brains a boost", "Whatever happened to the Harappan Civilisation?"], "x": false}, {"t": 4, "f": "C13/RE_C13T4.html", "p": ["Cutty Sark: the fastest sailing ship of all time", "SAVING THE SOIL", "Book Review"], "x": false}]}, {"n": 15, "tests": [{"t": 1, "f": "C15/RE_C15T1.html", "p": ["Nutmeg – a valuable spice", "Driverless cars", "What is exploration?"], "x": false}, {"t": 2, "f": "C15/RE_C15T2.html", "p": ["Could urban engineers learn from dance?", "Should we try to bring extinct species back to life?", "Having a laugh"], "x": false}, {"t": 3, "f": "C15/RE_C15T3.html", "p": ["Henry Moore (1898-1986)", "The Desolenator: producing clean water", "Why fairy tales are really scary tales"], "x": false}, {"t": 4, "f": "C15/RE_C15T4.html", "p": ["The return of the huarango", "Silbo Gomero – the whistle 'language' of the Canary Islands", "Environmental practices of big businesses"], "x": false}]}, {"n": 16, "tests": [{"t": 1, "f": "C16/RE_C16T1.html", "p": ["Why we need to protect polar bears", "The Step Pyramid of Djoser", "The future of work"], "x": false}, {"t": 2, "f": "C16/RE_C16T2.html", "p": ["The White Horse of Uffington", "I contain multitudes", "How to make wise decisions"], "x": false}, {"t": 3, "f": "C16/RE_C16T3.html", "p": ["Roman shipbuilding and navigation", "Climate change reveals ancient artefacts in Norway’s glaciers", "Plant ‘thermometer’ triggers springtime growth by measuring night-time heat"], "x": false}, {"t": 4, "f": "C16/RE_C16T4.html", "p": ["Roman tunnels", "Changes in reading habits", "Attitudes towards Artificial Intelligence"], "x": false}]}, {"n": 17, "tests": [{"t": 1, "f": "C17/RE_C17T1.html", "p": ["The development of the London underground railway", "Stadiums: past, present and future", "To catch a king"], "x": false}, {"t": 2, "f": "C17/RE_C17T2.html", "p": ["The Dead Sea Scrolls", "A second attempt at domesticating the tomato", "Insight or evolution?"], "x": false}, {"t": 3, "f": "C17/RE_C17T3.html", "p": ["The thylacine", "Palm oil", "Building the Skyline: The Birth and Growth of Manhattan’s Skyscrapers"], "x": false}, {"t": 4, "f": "C17/RE_C17T4.html", "p": ["Bats to the rescue", "Does education fuel economic growth?", "Timur Gareyev – blindfold chess champion"], "x": false}]}, {"n": 18, "tests": [{"t": 1, "f": "C18/RE_C18T1.html", "p": ["Urban farming", "Forest management in Pennsylvania, USA", "Conquering Earth's space junk problem"], "x": false}, {"t": 2, "f": "C18/RE_C18T2.html", "p": ["Stonehenge", "Living with artificial intelligence", "An ideal city"], "x": false}, {"t": 3, "f": "C18/RE_C18T3.html", "p": ["Materials to take us beyond concrete", "The steam car", "The case for mixed-ability classes"], "x": false}, {"t": 4, "f": "C18/RE_C18T4.html", "p": ["Green roofs", "The growth mindset", "Alfred Wegener: science, exploration and the theory of continental drift"], "x": false}]}, {"n": 19, "tests": [{"t": 1, "f": "C19/RE_C19T1.html", "p": ["How tennis rackets have changed", "The pirates of the ancient Mediterranean", "The persistence and peril of misinformation"], "x": false}, {"t": 2, "f": "C19/RE_C19T2.html", "p": ["The Industrial Revolution in Britain", "Athletes and stress", "An inquiry into the existence of the gifted child"], "x": false}, {"t": 3, "f": "C19/RE_C19T3.html", "p": ["Archaeologists discover evidence of prehistoric island settlers", "The global importance of wetlands", "Is the era of artificial speech translation upon us?"], "x": false}, {"t": 4, "f": "C19/RE_C19T4.html", "p": ["The impact of climate change on butterflies in Britain", "Deep-sea mining", "The Unselfish Gene"], "x": false}]}, {"n": 21, "tests": [{"t": 1, "f": "C21/RE_C21T1.html", "p": ["The Davies Sisters", "Why we need silence", "Book review: The World of Sugar"], "x": false}, {"t": 2, "f": "C21/RE_C21T2.html", "p": ["Do animals dream?", "Mapungubwe", "Artificial Intelligence"], "x": false}, {"t": 3, "f": "C21/RE_C21T3.html", "p": ["Saving the saiga", "The problems of getting around the city of Dar es Salaam", "Rethinking the Past"], "x": false}, {"t": 4, "f": "C21/RE_C21T4.html", "p": ["The problems and benefits created by the spread of the water hyacinth in Kenya", "How could multilingualism benefit India’s poorest schoolchildren?", "The Globemakers: The Curious Story of an Ancient Craft"], "x": false}]}];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main=document.getElementById('main'),jump=document.getElementById('jump'),q=document.getElementById('q');
const total=BOOKS.reduce((n,b)=>n+b.tests.length,0);
document.getElementById('count').textContent=`${BOOKS.length} Cambridge books · ${total} reading tests`;
function hi(s,t){if(!t)return esc(s);const i=s.toLowerCase().indexOf(t);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length))}
function render(){
  const t=q.value.trim().toLowerCase();let shown=0,h='',j='';
  for(const b of BOOKS){
    const cards=b.tests.filter(x=>{
      if(!t)return true;
      const hay=(`cambridge ielts ${b.n} c${b.n} book ${b.n} test ${x.t} t${x.t} c${b.n}t${x.t} `+x.p.join(' ')).toLowerCase();
      return t.split(/\s+/).every(w=>hay.includes(w));
    });
    if(!cards.length)continue;shown+=cards.length;
    j+=`<a href="#c${b.n}">C${b.n}</a>`;
    h+=`<section id="c${b.n}"><h2>Cambridge IELTS ${b.n}<small>${cards.length} test${cards.length>1?'s':''}</small></h2><div class="grid">`+
    cards.map(x=>`<a class="card" href="${encodeURI(x.f)}"><b>Test ${x.t}${x.x?'<span>alternate copy</span>':''}</b><ol>${x.p.map(p=>`<li>${hi(p,t)}</li>`).join('')}</ol></a>`).join('')+`</div></section>`;
  }
  main.innerHTML=h;jump.innerHTML=j;document.getElementById('empty').style.display=shown?'none':'block';
}
q.addEventListener('input',render);render();
</script>
</body>
</html>
